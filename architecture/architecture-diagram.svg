<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#24344d" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#52677f"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2474d2"/></marker>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#17263c}.sub{font:18px Arial,sans-serif;fill:#5b6d82}
      .group{fill:#fff;stroke:#cbd8e8;stroke-width:2}.glabel{font:700 18px Arial,sans-serif;fill:#4a5f78;letter-spacing:1.5px}
      .card{fill:#fff;stroke-width:2}.name{font:700 22px Arial,sans-serif;fill:#1d2b3d}.desc{font:16px Arial,sans-serif;fill:#607186}.mini{font:14px Arial,sans-serif;fill:#607186}
      .icon{font:700 25px Arial,sans-serif;fill:white}.line{fill:none;stroke:#52677f;stroke-width:3;marker-end:url(#arrow)}.blue{stroke:#2474d2;marker-end:url(#arrowBlue)}
      .dash{stroke-dasharray:9 8}.label{font:700 14px Arial,sans-serif;fill:#496079}.pill{fill:#f0f5fb;stroke:#cad7e6;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="90" y="72" class="title">Cloud Cost Monitoring &amp; Alert System</text>
  <text x="90" y="108" class="sub">Automated weekly cost reporting, dashboard publishing, and email notifications on AWS</text>

  <!-- AWS boundary -->
  <rect x="60" y="145" width="1280" height="785" rx="26" class="group" filter="url(#shadow)"/>
  <text x="90" y="184" class="glabel">AWS CLOUD · US-EAST-1</text>

  <!-- Scheduling group -->
  <rect x="90" y="215" width="300" height="260" rx="20" fill="#f8fbff" stroke="#cbd8e8" stroke-width="2"/>
  <text x="116" y="250" class="glabel">SCHEDULING</text>
  <g filter="url(#shadow)">
    <rect x="120" y="280" width="240" height="150" rx="16" class="card" stroke="#dc4f8f"/>
    <circle cx="168" cy="326" r="26" fill="#dc4f8f"/><text x="168" y="335" text-anchor="middle" class="icon">◷</text>
    <text x="208" y="320" class="name">EventBridge</text><text x="208" y="346" class="desc">Scheduler</text>
    <text x="144" y="390" class="mini">Every Monday · 09:00 JST</text><text x="144" y="414" class="mini">cron(0 9 ? * MON *)</text>
  </g>

  <!-- Processing group -->
  <rect x="430" y="215" width="420" height="430" rx="20" fill="#f8fbff" stroke="#cbd8e8" stroke-width="2"/>
  <text x="456" y="250" class="glabel">PROCESSING</text>
  <g filter="url(#shadow)">
    <rect x="470" y="300" width="340" height="210" rx="18" class="card" stroke="#ed7d22"/>
    <circle cx="525" cy="350" r="29" fill="#ed7d22"/><text x="525" y="359" text-anchor="middle" class="icon">λ</text>
    <text x="570" y="344" class="name">AWS Lambda</text><text x="570" y="372" class="desc">cloud-cost-report-generator</text>
    <text x="500" y="418" class="mini">• Compare current vs previous 7 days</text>
    <text x="500" y="446" class="mini">• Detect services with cost increases</text>
    <text x="500" y="474" class="mini">• Generate HTML report and summary</text>
  </g>
  <g>
    <rect x="490" y="548" width="300" height="60" rx="14" fill="#fff9ee" stroke="#e7bc68" stroke-width="2"/>
    <text x="515" y="573" class="name" font-size="18">IAM execution role</text><text x="515" y="595" class="mini">Least-privilege policies</text>
  </g>

  <!-- Data source -->
  <g filter="url(#shadow)">
    <rect x="470" y="700" width="340" height="150" rx="18" class="card" stroke="#527fff"/>
    <circle cx="525" cy="750" r="29" fill="#527fff"/><text x="525" y="759" text-anchor="middle" class="icon">$</text>
    <text x="570" y="744" class="name">AWS Cost Explorer</text><text x="570" y="772" class="desc">Cost and usage data</text>
    <text x="500" y="818" class="mini">GetCostAndUsage API</text>
  </g>

  <!-- Outputs group -->
  <rect x="890" y="215" width="410" height="635" rx="20" fill="#f8fbff" stroke="#cbd8e8" stroke-width="2"/>
  <text x="916" y="250" class="glabel">OUTPUTS &amp; OBSERVABILITY</text>
  <g filter="url(#shadow)">
    <rect x="930" y="285" width="330" height="135" rx="18" class="card" stroke="#4aa567"/>
    <circle cx="980" cy="330" r="27" fill="#4aa567"/><text x="980" y="339" text-anchor="middle" class="icon">S3</text>
    <text x="1022" y="325" class="name">Amazon S3</text><text x="1022" y="352" class="desc">Static cost dashboard</text>
    <text x="958" y="395" class="mini">index.html · updated weekly</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="470" width="330" height="135" rx="18" class="card" stroke="#d54478"/>
    <circle cx="980" cy="515" r="27" fill="#d54478"/><text x="980" y="524" text-anchor="middle" class="icon">✉</text>
    <text x="1022" y="510" class="name">Amazon SNS</text><text x="1022" y="537" class="desc">Email notification topic</text>
    <text x="958" y="580" class="mini">Weekly summary and cost alerts</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="655" width="330" height="135" rx="18" class="card" stroke="#7656b5"/>
    <circle cx="980" cy="700" r="27" fill="#7656b5"/><text x="980" y="709" text-anchor="middle" class="icon">LOG</text>
    <text x="1022" y="695" class="name">CloudWatch Logs</text><text x="1022" y="722" class="desc">Execution monitoring</text>
    <text x="958" y="765" class="mini">Status, errors, and troubleshooting</text>
  </g>

  <!-- Budget -->
  <g filter="url(#shadow)">
    <rect x="90" y="570" width="300" height="150" rx="18" class="card" stroke="#eb596e"/>
    <circle cx="142" cy="620" r="27" fill="#eb596e"/><text x="142" y="629" text-anchor="middle" class="icon">%</text>
    <text x="184" y="614" class="name">AWS Budgets</text><text x="184" y="642" class="desc">Threshold monitoring</text>
    <text x="120" y="690" class="mini">Independent budget alert flow</text>
  </g>

  <!-- External user -->
  <g filter="url(#shadow)">
    <rect x="1380" y="345" width="170" height="300" rx="22" fill="#fff" stroke="#7b8ca3" stroke-width="2"/>
    <circle cx="1465" cy="415" r="35" fill="#34495e"/><circle cx="1465" cy="406" r="11" fill="white"/><path d="M1444 431 Q1465 410 1486 431" fill="white"/>
    <text x="1465" y="482" text-anchor="middle" class="name">Project User</text>
    <text x="1465" y="516" text-anchor="middle" class="mini">Views dashboard</text>
    <text x="1465" y="542" text-anchor="middle" class="mini">Receives email</text>
    <rect x="1406" y="573" width="118" height="36" rx="18" class="pill"/><text x="1465" y="596" text-anchor="middle" class="label">Browser / Email</text>
  </g>

  <!-- Main arrows -->
  <path d="M360 355 H470" class="line blue"/><text x="384" y="339" class="label">Invoke</text>
  <path d="M640 700 V510" class="line blue"/><text x="656" y="670" class="label">Read costs</text>
  <path d="M810 355 H930" class="line"/><text x="832" y="339" class="label">Upload HTML</text>
  <path d="M810 405 C865 405 865 535 930 535" class="line"/><text x="830" y="458" class="label">Publish</text>
  <path d="M810 455 C850 455 850 720 930 720" class="line dash"/><text x="824" y="625" class="label">Write logs</text>
  <path d="M390 645 C650 645 700 560 930 545" class="line"/><text x="545" y="621" class="label">Threshold alert</text>
  <path d="M1260 352 H1325 C1350 352 1350 430 1380 430" class="line blue"/><text x="1285" y="334" class="label">View</text>
  <path d="M1260 538 H1380" class="line blue"/><text x="1290" y="520" class="label">Email</text>

  <!-- Legend -->
  <rect x="90" y="875" width="820" height="36" rx="18" fill="#f0f5fb"/>
  <line x1="120" y1="893" x2="170" y2="893" stroke="#2474d2" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="184" y="899" class="mini">Primary automated flow</text>
  <line x1="390" y1="893" x2="440" y2="893" stroke="#52677f" stroke-width="3" marker-end="url(#arrow)"/><text x="454" y="899" class="mini">Data / notification flow</text>
  <line x1="680" y1="893" x2="730" y2="893" stroke="#52677f" stroke-width="3" stroke-dasharray="8 7"/><text x="744" y="899" class="mini">Logging</text>
</svg>
